# SDD Configuration — PROYECTOUEMPRESARIAL
# Vocational guidance web platform for Colombian secondary students

context: |
  Vocational guidance platform for Colombian secondary students (career
  orientation, RIASEC-based scoring).
  Built project (not greenfield): production live on Vercel at
  tu-futuro-dual.vercel.app. Stack: Next.js 16.3.0 App Router + React 19.2.8 +
  Tailwind CSS 4 + Supabase (auth/DB/storage) + NextAuth v5 beta + Zustand 5 +
  Zod 4. Tests: 141 Vitest 4 unit tests (5 files in src/lib/__tests__); the
  build pipeline gates on `tsc --noEmit && vitest run`.

strict_tdd: true

testing:
  runner: vitest
  framework: vitest
  test_command: npx vitest run
  unit: true
  integration: false
  e2e: false
  coverage: false

phases:
  proposal:
    required: true
    gate: intent + scope + approach
  spec:
    required: true
    gate: scenarios + acceptance criteria
  design:
    required: true
    gate: architecture + component model
  tasks:
    required: true
    gate: ordered task list with dependencies
  apply:
    required: true
    gate: implementation per tasks
  verify:
    required: true
    gate: tests pass + specs satisfied
  archive:
    required: true
    gate: delta specs synced + changes archived
