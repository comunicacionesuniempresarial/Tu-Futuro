<script>
        // Simple script to handle visual update on radio selection for the custom indicators
        document.querySelectorAll('input[type="radio"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                // Remove active classes from all indicators
                document.querySelectorAll('.rounded-full.border-2').forEach(indicator => {
                    indicator.classList.remove('border-primary');
                    indicator.classList.add('border-outline-variant');
                });
                document.querySelectorAll('.rounded-full.bg-primary').forEach(dot => {
                    dot.classList.remove('opacity-100', 'scale-100');
                    dot.classList.add('opacity-0', 'scale-50');
                });

                // Add active classes to selected indicator
                if(e.target.checked) {
                    const parent = e.target.closest('label');
                    const indicator = parent.querySelector('.rounded-full.border-2');
                    const dot = parent.querySelector('.rounded-full.bg-primary');
                    
                    indicator.classList.remove('border-outline-variant');
                    indicator.classList.add('border-primary');
                    
                    dot.classList.remove('opacity-0', 'scale-50');
                    dot.classList.add('opacity-100', 'scale-100');
                }
            });
        });
    </script>
