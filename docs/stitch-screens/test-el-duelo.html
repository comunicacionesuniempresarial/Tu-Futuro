<style>
        /* Magical Realism Shaders & Effects */
        .glass-panel {
            background: rgba(30, 31, 42, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(233, 196, 0, 0.2);
            box-shadow: inset 0 0 20px rgba(233, 196, 0, 0.05);
        }
        
        .holographic-glow {
            position: relative;
        }
        .holographic-glow::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(45deg, transparent, rgba(58, 220, 204, 0.4), rgba(233, 196, 0, 0.4), transparent);
            border-radius: inherit;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .holographic-glow:hover::before, .holographic-glow.active::before {
            opacity: 1;
            animation: shimmer 2s linear infinite;
        }
        
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .card-hand {
            perspective: 1000px;
        }
        
        .playing-card {
            transform-style: preserve-3d;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: bottom center;
        }
        
        /* Fan layout for cards */
        .card-hand > *:nth-child(1) { transform: rotate(-10deg) translateY(10px); }
        .card-hand > *:nth-child(2) { transform: rotate(-5deg) translateY(2px); }
        .card-hand > *:nth-child(3) { transform: rotate(0deg) translateY(0); }
        .card-hand > *:nth-child(4) { transform: rotate(5deg) translateY(2px); }
        .card-hand > *:nth-child(5) { transform: rotate(10deg) translateY(10px); }
        
        .playing-card:hover {
            transform: translateY(-30px) scale(1.05) rotate(0deg) !important;
            z-index: 10;
        }

        /* Animated Progress Bar */
        .mana-bar-fill {
            background: linear-gradient(90deg, #00766d, #3adccc);
            box-shadow: 0 0 10px rgba(58, 220, 204, 0.6);
            transition: width 1s ease-in-out;
        }
        
        .particle {
            position: absolute;
            pointer-events: none;
            background: radial-gradient(circle, #ffe16d 0%, transparent 70%);
            border-radius: 50%;
            animation: float-up 2s linear forwards;
        }
        
        @keyframes float-up {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-50px) scale(0); opacity: 0; }
        }

        /* Ambient Library Background */
        .ambient-bg {
            background-color: #12131d;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(112, 66, 248, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(233, 196, 0, 0.1) 0%, transparent 40%);
        }
    </style>

<script>
        // Simple spark effect generator for the Mana bar
        const manaContainer = document.getElementById('mana-container');
        
        function createSpark() {
            const spark = document.createElement('div');
            spark.classList.add('particle');
            
            // Random positioning along the filled portion
            const leftPos = Math.random() * 60; // corresponds to 60% width
            spark.style.left = `${leftPos}%`;
            spark.style.bottom = '0';
            
            // Random size
            const size = Math.random() * 4 + 2;
            spark.style.width = `${size}px`;
            spark.style.height = `${size}px`;
            
            manaContainer.appendChild(spark);
            
            // Remove after animation
            setTimeout(() => {
                spark.remove();
            }, 2000);
        }

        // Generate sparks periodically
        setInterval(createSpark, 300);

        // Add interaction to cards
        const cards = document.querySelectorAll('.playing-card');
        cards.forEach(card => {
            card.addEventListener('click', function() {
                // Remove active state from all
                cards.forEach(c => {
                    c.classList.remove('holographic-glow', 'active');
                    c.style.transform = ''; // reset to CSS defined transform
                });
                
                // Add to clicked
                this.classList.add('holographic-glow', 'active');
                
                // Simulate selection sound/effect (visual only)
                this.style.transform = 'translateY(-40px) scale(1.1) rotate(0deg)';
                this.style.zIndex = '20';
            });
        });
    </script>
